<div class="month-tabs">
  <app-month-picker
    [value]="displayedMonth()"
    [active]="monthActive()"
    (valueChange)="selectMonth($event)"
  />
  <button
    type="button"
    class="month-tabs__chip month-tabs__chip--clear"
    [class.month-tabs__chip--active]="allActive()"
    title="Limpar filtro de período"
    (click)="clear()"
  >
    Tudo
  </button>
</div>
