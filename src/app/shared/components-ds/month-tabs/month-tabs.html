<div class="month-tabs">
  @for (chip of chips(); track chip.label) {
    <button
      type="button"
      class="month-tabs__chip"
      [class.month-tabs__chip--active]="chip.active"
      (click)="select(chip)"
    >
      {{ chip.label }}
    </button>
  }
  <button
    type="button"
    class="month-tabs__chip month-tabs__chip--clear"
    [class.month-tabs__chip--active]="allActive()"
    title="Limpar filtro de período"
    (click)="clear()"
  >
    Tudo
  </button>
</div>
