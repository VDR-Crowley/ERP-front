<span class="app-date-picker">
  <p-datepicker
    [selectionMode]="mode()"
    [ngModel]="internalValue()"
    (ngModelChange)="onModelChange($event)"
    [readonlyInput]="true"
    [showIcon]="true"
    iconDisplay="input"
    [showButtonBar]="true"
    dateFormat="d M yy"
    [placeholder]="resolvedPlaceholder()"
    styleClass="app-date-picker__field"
    panelStyleClass="app-date-picker__panel"
  />
  <i class="pi pi-chevron-down app-date-picker__chevron" aria-hidden="true"></i>
</span>
